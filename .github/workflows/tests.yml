name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all programs (warnings fail the build)
        run: make CFLAGS="-std=c11 -Wall -Wextra -Wno-unused-result -Werror -O2"
      - name: Run checks
        run: make test
